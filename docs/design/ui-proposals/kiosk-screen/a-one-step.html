<title>한눈에 한 걸음</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;800;900&display=swap">
<style>
/* Layout: proposal A — every kiosk screen has one big action in a dock across the lower third
   (where a child's hand reaches); the server app opens on "오늘" with only four places to go. */
:root {
  --paper: #faf7f2;      /* warm white */
  --card: #ffffff;
  --ink: #18312c;        /* evergreen ink */
  --ink-2: #4f625d;
  --line: #e6e0d6;
  --sun: #f0a62a;        /* marigold: the one action */
  --sun-ink: #3a2500;
  --sage: #e3ece6;
  --ok: #2f8a5f;
  --warn: #c0661b;
  --font: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --paper: #161a19; --card: #1f2523; --ink: #eef2ef; --ink-2: #a9b6b1; --line: #2f3734; --sage: #24302b; color-scheme: dark; }
}
:root[data-theme="dark"] { --paper: #161a19; --card: #1f2523; --ink: #eef2ef; --ink-2: #a9b6b1; --line: #2f3734; --sage: #24302b; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--font); line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 56px; }
.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 22px; }
.intro { display: grid; gap: 10px; max-width: 820px; }
.eyebrow { font-size: .78rem; font-weight: 700; letter-spacing: .1em; color: var(--ink-2); }
.intro h1 { font-size: 2.3rem; font-weight: 900; margin: 0; letter-spacing: -.02em; text-wrap: balance; }
.intro p { margin: 0; color: var(--ink-2); max-width: 65ch; }
.principles { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.principles div { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; font-size: .92rem; }
.principles b { display: block; font-size: 1rem; }

/* test panel (shared markup from proto.js) */
.lab { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 8px; font-size: .9rem; }
.lab-row { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.lab-label { color: var(--ink-2); font-weight: 700; font-size: .8rem; margin-right: 4px; min-width: 64px; }
.lab button { font: inherit; border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
.lab button:hover { border-color: var(--ink-2); }
.lab .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--paper); }
.lab .seg button { border: 0; background: transparent; }
.lab [aria-selected="true"], .lab [aria-pressed="true"] { background: var(--ink) !important; color: var(--paper) !important; border-color: var(--ink) !important; }
.lab-check { display: inline-flex; gap: 6px; align-items: center; margin-left: auto; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

.device { position: relative; width: 100%; border-radius: 28px; background: #121614; padding: 0; overflow: hidden; box-shadow: 0 0 0 10px #121614, 0 20px 50px rgba(30,40,35,.25); margin: 10px; width: calc(100% - 20px); }
.device-screen { position: absolute; top: 0; left: 0; width: 1280px; height: 800px; transform-origin: 0 0; overflow: hidden; background: var(--paper); font-family: var(--font); color: var(--ink); }

/* ================= KIOSK ================= */
.k { position: absolute; inset: 0; }
.cam { position: absolute; inset: 0; background:
  radial-gradient(60% 50% at 30% 30%, #f3d9b8 0%, transparent 70%),
  radial-gradient(40% 40% at 80% 20%, #e9c79f 0%, transparent 70%),
  linear-gradient(160deg, #cdb79a, #8e7a64); }
.cam::after { content: ""; position: absolute; inset: 0; background: rgba(250,247,242,.18); }
.k[data-dim="true"] .cam::after { background: rgba(24,49,44,.45); }
.oval { position: absolute; left: 50%; top: 47%; width: 320px; height: 390px; transform: translate(-50%, -50%); border-radius: 50%; overflow: hidden; border: 6px solid rgba(255,255,255,.9); box-shadow: 0 0 0 2000px rgba(24,49,44,.28); transition: border-color .3s; }
.oval.found { border-color: var(--sun); }
.silhouette { position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%); width: 270px; opacity: .55; }
.status { position: absolute; top: 22px; left: 24px; display: flex; gap: 8px; }
.pill { background: rgba(255,255,255,.92); color: var(--ink); border-radius: 999px; padding: 6px 14px; font-size: 18px; font-weight: 700; display: inline-flex; gap: 8px; align-items: center; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); }
.dot.off { background: var(--warn); }
.homebtn { position: absolute; top: 18px; right: 22px; width: 64px; height: 64px; border-radius: 50%; border: 0; background: rgba(255,255,255,.92); color: var(--ink); display: grid; place-items: center; cursor: pointer; }
.homebtn svg { width: 30px; height: 30px; }
.headline { position: absolute; left: 0; right: 0; top: 96px; text-align: center; font-size: 40px; font-weight: 800; color: #fff; text-shadow: 0 2px 12px rgba(0,0,0,.35); letter-spacing: -.01em; }

.dock { position: absolute; left: 24px; right: 24px; bottom: 24px; background: var(--card); border-radius: 32px; padding: 28px 32px; box-shadow: 0 10px 40px rgba(24,49,44,.2); display: flex; gap: 28px; align-items: center; min-height: 190px; }
.dock .who { flex: 1; min-width: 0; display: grid; gap: 4px; }
.dock .name { font-size: 76px; font-weight: 900; line-height: 1.05; letter-spacing: -.02em; }
.dock .sub { font-size: 26px; color: var(--ink-2); font-weight: 600; display: flex; align-items: center; gap: 10px; }
.chipdot { width: 18px; height: 18px; border-radius: 50%; display: inline-block; }
.dock .msg { font-size: 34px; font-weight: 800; line-height: 1.3; flex: 1; }
.dock .msg small { display: block; font-size: 22px; font-weight: 500; color: var(--ink-2); margin-top: 6px; }

.big { border: 0; border-radius: 26px; font-family: var(--font); font-weight: 900; font-size: 38px; padding: 0 44px; height: 132px; display: inline-flex; align-items: center; gap: 18px; cursor: pointer; white-space: nowrap; }
.big svg { width: 52px; height: 52px; }
.big.primary { background: var(--sun); color: var(--sun-ink); box-shadow: 0 6px 0 #c9851a; }
.big.primary:active { transform: translateY(4px); box-shadow: 0 2px 0 #c9851a; }
.big.second { background: var(--sage); color: var(--ink); }
.big.quiet { background: transparent; color: var(--ink-2); font-size: 24px; height: auto; padding: 8px 12px; font-weight: 700; }
.k[data-aud="adults"] .big { font-size: 32px; height: 112px; }
.k[data-aud="adults"] .dock .name { font-size: 64px; }
.k[data-aud="adults"] .big.quiet { font-size: 22px; height: auto; }

.choices { display: flex; gap: 18px; }
.namecard { border: 0; background: var(--paper); border-radius: 26px; padding: 22px 34px; min-width: 300px; text-align: left; cursor: pointer; font-family: var(--font); color: var(--ink); border: 3px solid var(--line); }
.namecard:hover { border-color: var(--sun); }
.namecard b { display: block; font-size: 52px; font-weight: 900; }
.namecard span { font-size: 22px; color: var(--ink-2); font-weight: 600; }

/* registration */
.ring { position: absolute; left: 50%; top: 40%; width: 420px; height: 500px; transform: translate(-50%, -50%); }
.ring svg { width: 100%; height: 100%; overflow: visible; }
.arrowbig { position: absolute; top: 47%; transform: translateY(-50%); font-size: 150px; font-weight: 900; color: var(--sun); text-shadow: 0 4px 20px rgba(0,0,0,.25); }
.steps4 { display: flex; gap: 12px; }
.step { width: 92px; height: 92px; border-radius: 22px; background: var(--paper); border: 3px solid var(--line); display: grid; place-items: center; font-size: 44px; font-weight: 900; color: var(--ink-2); position: relative; }
.step.now { border-color: var(--sun); color: var(--ink); }
.step.done { background: var(--ok); border-color: var(--ok); color: #fff; }
.step i { position: absolute; bottom: 6px; left: 12px; right: 12px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.step i::after { content: ""; position: absolute; inset: 0; width: var(--p); background: var(--sun); }

/* teacher form */
.sheet { position: absolute; right: 24px; top: 100px; bottom: 24px; width: 600px; background: var(--card); border-radius: 32px; padding: 30px 34px; box-shadow: 0 10px 40px rgba(24,49,44,.25); display: flex; flex-direction: column; gap: 16px; }
.sheet h2 { margin: 0; font-size: 30px; font-weight: 900; line-height: 1.25; }
.sheet .hint { font-size: 20px; color: var(--ink-2); margin: -8px 0 0; }
.field { display: grid; gap: 6px; }
.field label { font-size: 18px; font-weight: 700; color: var(--ink-2); }
.field input { font: inherit; font-size: 34px; font-weight: 800; padding: 12px 18px; border-radius: 18px; border: 3px solid var(--line); background: var(--paper); color: var(--ink); width: 100%; }
.field input:focus { border-color: var(--sun); outline: none; }
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chip { font-family: var(--font); font-size: 22px; font-weight: 700; border: 3px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 999px; padding: 8px 18px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--paper); }
.sheet .big { height: 104px; font-size: 34px; justify-content: center; margin-top: auto; }

/* printing / done */
.center { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; background: var(--paper); }
.center .inner { display: grid; gap: 22px; justify-items: center; }
.tag { width: 460px; height: 300px; background: #fff; border-radius: 18px; box-shadow: 0 16px 40px rgba(24,49,44,.18); padding: 36px 40px; text-align: left; display: grid; align-content: center; gap: 6px; border-top: 22px solid var(--tagc, var(--sun)); color: #18312c; }
.tag b { font-size: 76px; font-weight: 900; line-height: 1; }
.tag span { font-size: 28px; font-weight: 700; color: #4f625d; }
.printing .tag { animation: feed 1.6s ease-out both; }
@keyframes feed { from { transform: translateY(-60px); opacity: 0; clip-path: inset(0 0 100% 0); } to { transform: none; opacity: 1; clip-path: inset(0 0 0 0); } }
.big-msg { font-size: 46px; font-weight: 900; letter-spacing: -.01em; }
.count { width: 96px; height: 96px; border-radius: 50%; border: 8px solid var(--sage); display: grid; place-items: center; font-size: 40px; font-weight: 900; position: relative; }
.check { width: 120px; height: 120px; border-radius: 50%; background: var(--ok); display: grid; place-items: center; }
.check svg { width: 70px; height: 70px; color: #fff; }
.banner { position: absolute; left: 0; right: 0; top: 0; background: var(--warn); color: #fff; font-size: 22px; font-weight: 700; padding: 10px 24px; text-align: center; }
.pendingbox { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(24,49,44,.82); color: #fff; text-align: center; }
.pendingbox div { display: grid; gap: 14px; max-width: 760px; }
.pendingbox b { font-size: 46px; font-weight: 900; }
.pendingbox code { font-size: 30px; background: rgba(255,255,255,.15); padding: 6px 16px; border-radius: 12px; }
.ktoast { position: absolute; left: 50%; bottom: 240px; transform: translateX(-50%); background: var(--ink); color: var(--paper); font-size: 24px; font-weight: 700; padding: 12px 24px; border-radius: 999px; }
@media (prefers-reduced-motion: reduce) { .printing .tag { animation: none; } }

/* ================= SERVER ================= */
.s { position: absolute; inset: 0; display: grid; grid-template-columns: 236px 1fr; background: var(--paper); font-size: 20px; }
.rail { background: var(--ink); color: var(--paper); padding: 26px 14px; display: flex; flex-direction: column; gap: 8px; }
.brand { font-weight: 900; font-size: 22px; padding: 0 10px 18px; line-height: 1.2; }
.brand small { display: block; font-size: 15px; font-weight: 500; opacity: .7; }
.navbtn { border: 0; background: transparent; color: inherit; font-family: var(--font); font-size: 21px; font-weight: 700; text-align: left; padding: 14px 14px; border-radius: 16px; cursor: pointer; display: flex; gap: 12px; align-items: center; position: relative; }
.navbtn svg { width: 26px; height: 26px; flex: none; }
.navbtn[aria-current="true"] { background: var(--paper); color: var(--ink); }
.navbtn .badge { margin-left: auto; background: var(--sun); color: var(--sun-ink); border-radius: 999px; font-size: 15px; padding: 1px 9px; }
.rail .state { margin-top: auto; font-size: 16px; padding: 12px; border-radius: 14px; background: rgba(255,255,255,.08); display: grid; gap: 2px; }
.rail .state b { display: flex; gap: 8px; align-items: center; }
.main { padding: 30px 36px; overflow: auto; display: flex; flex-direction: column; gap: 22px; }
.main h1 { font-size: 36px; font-weight: 900; margin: 0; letter-spacing: -.01em; }
.main h1 small { display: block; font-size: 19px; color: var(--ink-2); font-weight: 500; }
.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 22px 24px; display: grid; gap: 8px; align-content: start; }
.card .k-label { font-size: 17px; font-weight: 700; color: var(--ink-2); }
.card .k-num { font-size: 54px; font-weight: 900; line-height: 1; letter-spacing: -.02em; }
.card .k-num small { font-size: 22px; color: var(--ink-2); font-weight: 700; }
.card.alert { border: 3px solid var(--sun); }
.sbtn { font-family: var(--font); font-size: 20px; font-weight: 800; border-radius: 16px; border: 0; padding: 14px 22px; cursor: pointer; background: var(--sage); color: var(--ink); }
.sbtn.primary { background: var(--sun); color: var(--sun-ink); }
.sbtn.danger { background: transparent; color: var(--warn); border: 2px solid currentColor; }
.sbtn.ghost { background: transparent; border: 2px solid var(--line); }
.list { background: var(--card); border: 1px solid var(--line); border-radius: 22px; overflow: hidden; }
.row { display: grid; grid-template-columns: 22px 1fr auto auto; gap: 16px; align-items: center; padding: 14px 22px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row .nm { font-weight: 800; font-size: 22px; }
.row .meta { color: var(--ink-2); font-size: 18px; }
.row.click { cursor: pointer; }
.row.click:hover { background: var(--sage); }
.search { font: inherit; font-size: 24px; padding: 14px 20px; border-radius: 18px; border: 2px solid var(--line); background: var(--card); color: var(--ink); width: 100%; }
.depts { display: flex; gap: 8px; flex-wrap: wrap; }
.bar { height: 14px; border-radius: 7px; background: var(--sage); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ok); border-radius: 7px; }
.groups { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
.group { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 18px 22px; display: grid; gap: 10px; }
.group h3 { margin: 0; font-size: 24px; display: flex; gap: 10px; align-items: center; }
.group h3 span { margin-left: auto; font-size: 20px; color: var(--ink-2); }
.names { display: flex; flex-wrap: wrap; gap: 6px; }
.names span { background: var(--sage); border-radius: 999px; padding: 2px 12px; font-size: 18px; font-weight: 600; }
.names span.no { background: transparent; color: var(--ink-2); border: 1px dashed var(--line); }
.editsheet { background: var(--card); border: 3px solid var(--sun); border-radius: 22px; padding: 20px 24px; display: grid; gap: 14px; }
.editsheet .grid2 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.editsheet input, .editsheet select { font: inherit; font-size: 22px; padding: 10px 14px; border-radius: 14px; border: 2px solid var(--line); background: var(--paper); color: var(--ink); width: 100%; }
.stoast { position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); background: var(--ink); color: var(--paper); font-weight: 700; padding: 12px 22px; border-radius: 999px; font-size: 19px; }
.feed { display: grid; gap: 0; }
</style>

<div class="wrap">
  <header class="intro">
    <span class="eyebrow">제안 A · UI 연구 · Faith ID</span>
    <h1>한눈에 한 걸음</h1>
    <p>화면마다 할 일은 하나, 버튼도 하나입니다. 큰 글씨와 큰 버튼을 아이 손이 닿는 화면 아래쪽에 모았고, 서버 앱은 “오늘” 한 화면에서 주일 아침에 필요한 일을 끝낼 수 있게 했습니다.</p>
    <div class="principles">
      <div><b>버튼은 하나</b>다음 할 일만 노란 큰 버튼으로. 128px 높이, 아래쪽 1/3에 배치</div>
      <div><b>읽지 않아도 됨</b>화살표, 체크, 색 점과 음성 안내로 글을 몰라도 진행</div>
      <div><b>선생님은 고르기만</b>부서와 학년은 칩으로 고르고, 이름만 입력</div>
    </div>
  </header>
  <div id="app"></div>
</div>

<script src="proto.js"></script>
<script>
const P = window.Proto;
const I = {
  print: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/></svg>',
  face: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="10" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/><path d="M19 3v4M17 5h4"/></svg>',
  tag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 11h6M7 14h4"/></svg>',
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',
  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  people: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c1-3.5 3.5-5 6.5-5s5.5 1.5 6.5 5"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.5c2.7 0 4.7 1.4 5.5 4.5"/></svg>',
  list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg>',
  tablet: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M9 21h6"/></svg>',
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const silhouette = '<svg class="silhouette" viewBox="0 0 200 240" aria-hidden="true"><circle cx="100" cy="88" r="58" fill="#fff"/><path d="M14 240c8-56 44-86 86-86s78 30 86 86z" fill="#fff"/></svg>';

function kioskBase(s, inner, opts = {}) {
  const face = s.face && s.face.kind !== 'leave';
  const conn = s.connection === 'online'
    ? '<span class="pill"><i class="dot"></i>연결됨</span>'
    : s.connection === 'offline' ? '<span class="pill"><i class="dot off"></i>오프라인 · 출석 보관 중</span>' : '';
  return `<div class="k" data-aud="${s.audience}" data-dim="${opts.dim ? 'true' : 'false'}">
    <div class="cam"></div>
    ${opts.oval === false ? '' : `<div class="oval ${opts.found ? 'found' : ''}">${face ? silhouette : ''}</div>`}
    <div class="status">${conn}</div>
    <button class="homebtn" data-act="home" aria-label="${P.t('home')}">${I.home}</button>
    ${inner}
    ${s.connection === 'pending' ? `<div class="pendingbox"><div><b>${P.t('pending')}</b><span style="font-size:24px">서버 앱 › 오늘 › 허락하기</span><code>client-3f90</code></div></div>` : ''}
    ${s.toast ? `<div class="ktoast">${esc(s.toast)}</div>` : ''}
  </div>`;
}

function tagHtml(p, guest) {
  const d = p ? P.dept(p.dept) : null;
  const name = p ? p.name : guest.name;
  const sub = p ? `${d.name} · ${p.grade}` : [guest.dept, guest.grade].filter(Boolean).join(' · ');
  return `<div class="tag" style="--tagc:${d ? d.color : '#9aa3b5'}"><b>${esc(name)}</b><span>${esc(sub)}</span></div>`;
}

function deptChips(s) {
  const grades = s.form.dept ? P.GRADES[s.form.dept] : [];
  return `<div class="field"><label>부서</label><div class="chips">${P.DEPTS.map(d =>
    `<button class="chip" data-act="dept" data-id="${d.id}" aria-pressed="${s.form.dept === d.id}"><i class="chipdot" style="background:${d.color}"></i>${d.name}</button>`).join('')}</div></div>
    ${grades.length ? `<div class="field"><label>학년 · 나이</label><div class="chips">${grades.map(g =>
      `<button class="chip" data-act="grade" data-id="${g}" aria-pressed="${s.form.grade === g}">${g}</button>`).join('')}</div></div>` : ''}`;
}

function kiosk(s) {
  const p = s.person;
  switch (s.screen) {
    case 'idle':
      return kioskBase(s, `<div class="headline">${P.t('idle')}</div>
        <div class="dock"><div class="msg">${s.audience === 'kids' ? '안녕! 동그라미 안에 얼굴이 보이면<br>내 이름이 나와요' : '얼굴을 원 안에 맞춰 주세요'}<small>사진은 저장하지 않아요</small></div></div>`);
    case 'detecting':
      return kioskBase(s, `<div class="dock"><div class="msg">${s.audience === 'kids' ? '누구일까… 잠깐만요' : '확인하고 있습니다'}</div></div>`, { found: true });
    case 'recognized': {
      const d = P.dept(p.dept);
      return kioskBase(s, `<div class="headline">${esc(P.t('hello', p))}</div>
        <div class="dock"><div class="who"><div class="name">${esc(p.name)}</div>
          <div class="sub"><i class="chipdot" style="background:${d.color}"></i>${d.name} · ${esc(p.grade)}
          <button class="big quiet" data-act="home">내가 아니에요</button></div></div>
          <button class="big primary" data-act="print">${I.print}${P.t('printCta')}</button></div>`, { found: true });
    }
    case 'candidates':
      return kioskBase(s, `<div class="headline">${P.t('twins')}</div>
        <div class="dock"><div class="choices">${s.candidates.map(c => `<button class="namecard" data-act="pick" data-id="${c.id}"><b>${esc(c.name)}</b><span>${P.dept(c.dept).name} · ${esc(c.grade)}</span></button>`).join('')}</div>
        <button class="big quiet" data-act="home" style="margin-left:auto">둘 다 아니에요</button></div>`, { found: true });
    case 'unknown':
      return kioskBase(s, `<div class="headline">${P.t('unknown')}</div>
        <div class="dock"><button class="big primary" data-act="register" style="flex:1.2;justify-content:center">${I.face}${P.t('register')}</button>
        <button class="big second" data-act="labelonly" style="flex:1;justify-content:center">${I.tag}${P.t('labelOnly')}</button></div>`, { found: true });
    case 'register': {
      const r = s.reg, dir = P.DIRECTIONS[Math.min(r.dir, 3)];
      const pos = { left: 'left:250px', right: 'right:250px', up: 'left:50%;transform:translate(-50%,-78%)', down: 'left:50%;transform:translate(-50%,-10%)' }[dir.id];
      return kioskBase(s, `<div class="headline">${esc(P.t('regTurn', dir))}</div>
        ${r.dir < 4 ? `<div class="arrowbig" style="${pos}">${dir.arrow}</div>` : ''}
        <div class="dock"><div class="msg">${s.audience === 'kids' ? '화살표 쪽으로 천천히!' : '안내에 따라 천천히 움직여 주세요'}<small>네 방향을 모두 채우면 끝나요</small></div>
        <div class="steps4">${P.DIRECTIONS.map((d, i) => `<div class="step ${i < r.dir ? 'done' : i === r.dir ? 'now' : ''}" style="--p:${Math.round(r.counts[i] / P.PER_DIRECTION * 100)}%">${i < r.dir ? '✓' : d.arrow}<i></i></div>`).join('')}</div></div>`, { found: true });
    }
    case 'regName':
      return kioskBase(s, `<div class="sheet"><h2>${P.t('regName')}</h2><p class="hint">얼굴 사진 12장을 모았어요.</p>
        <div class="field"><label for="f-name">이름</label><input id="f-name" data-field="name" value="${esc(s.form.name)}" placeholder="예: 김하은" autocomplete="off"></div>
        ${deptChips(s)}
        <button class="big primary" data-act="save">${I.check}저장하기</button></div>`, { dim: true, oval: false });
    case 'saved':
      return kioskBase(s, `<div class="center"><div class="inner"><div class="check">${I.check}</div><div class="big-msg">${P.t('saved')}</div>${tagHtml(p)}</div></div>`, { oval: false });
    case 'confirmSelf':
      return kioskBase(s, `<div class="headline">이미 등록된 얼굴이에요</div>
        <div class="dock"><div class="who"><div class="name" style="font-size:42px;white-space:nowrap">${esc(P.t('confirm', p))}</div><div class="sub">${P.dept(p.dept).name} · ${esc(p.grade)}</div></div>
        <button class="big primary" data-act="confirm-yes">${I.check}${P.t('confirmYes')}</button>
        <button class="big second" data-act="confirm-no">${P.t('confirmNo')}</button></div>`, { found: true });
    case 'labelOnly':
      return kioskBase(s, `<div class="sheet"><h2>${s.audience === 'kids' ? '이름표에 쓸 이름을 알려 줘요' : '이름표에 넣을 내용을 입력해 주세요'}</h2><p class="hint">얼굴은 저장하지 않아요. 출석부에는 ‘명단 외’로 남아요.</p>
        <div class="field"><label for="f-gname">이름</label><input id="f-gname" data-field="name" value="${esc(s.form.name)}" placeholder="예: 이준호" autocomplete="off"></div>
        ${deptChips(s)}
        <button class="big primary" data-act="printlabel">${I.print}이름표 받기</button></div>`, { dim: true, oval: false });
    case 'printing':
      return kioskBase(s, `<div class="center printing"><div class="inner">${tagHtml(p, s.guest)}<div class="big-msg">${P.t('printing')}</div></div></div>`, { oval: false });
    case 'done':
      return kioskBase(s, `<div class="center"><div class="inner"><div class="check">${I.check}</div><div class="big-msg">${esc(P.t('done', p))}</div>
        <div class="count" aria-label="${s.countdown}초 후 처음 화면">${s.countdown}</div></div></div>`, { oval: false });
  }
  return '';
}

/* ---------------- server ---------------- */
function server(s) {
  const pending = P.kiosks.filter(k => k.status === 'pending');
  const nav = [['home', '오늘', I.sun], ['people', '명단', I.people], ['attendance', '출석부', I.list], ['kiosks', '키오스크', I.tablet]];
  const rail = `<nav class="rail" aria-label="서버 앱 메뉴"><div class="brand">Faith DB Server<small>우리교회 · 관리자</small></div>
    ${nav.map(([id, label, icon]) => `<button class="navbtn" data-act="tab" data-id="${id}" aria-current="${s.tab === id}">${icon}${label}${id === 'kiosks' && pending.length ? `<span class="badge">${pending.length}</span>` : ''}</button>`).join('')}
    <div class="state"><b><i class="dot"></i>서버 켜짐</b><span>주소 192.168.45.107</span></div></nav>`;
  let body = '';
  if (s.tab === 'home') body = serverHome(s, pending);
  if (s.tab === 'people') body = serverPeople(s);
  if (s.tab === 'attendance') body = serverAttendance(s);
  if (s.tab === 'kiosks') body = serverKiosks(s);
  return `<div class="s">${rail}<main class="main">${body}</main>${s.toast ? `<div class="stoast">${esc(s.toast)}</div>` : ''}</div>`;
}
function serverHome(s, pending) {
  const total = P.people.length, present = P.attendance.filter(a => a.person).length, guests = P.guests().length;
  const recent = [...P.attendance].sort((a, b) => b.last - a.last).slice(0, 6);
  return `<h1>좋은 주일 아침이에요<small>10월 31일 · 지금 할 일이 위에 보입니다</small></h1>
    ${pending.length ? `<div class="card alert" style="grid-template-columns:1fr auto;align-items:center"><div><div class="k-label">새 키오스크가 연결을 기다려요</div><div style="font-size:26px;font-weight:800">${esc(pending[0].name)}</div><div class="k-label">우리 교회 태블릿이 맞으면 허락해 주세요</div></div>
      <button class="sbtn primary" data-act="approve" data-id="${pending[0].id}">허락하기</button></div>` : ''}
    <div class="cards">
      <div class="card"><span class="k-label">오늘 출석</span><span class="k-num">${present}<small> / ${total}명</small></span><span class="k-label">명단 외 ${guests}명</span></div>
      <div class="card"><span class="k-label">키오스크</span><span class="k-num">${P.kiosks.filter(k => k.status === 'online').length}<small>대 연결</small></span><span class="k-label">${pending.length ? `${pending.length}대 허락 대기` : '모두 정상'}</span></div>
      <div class="card"><span class="k-label">서버</span><span class="k-num" style="font-size:40px;color:var(--ok)">켜짐</span><span class="k-label">자동 시작 켬 · 백업 어제 22:00</span></div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:24px">방금 출석한 사람</b><button class="sbtn ghost" data-act="tab" data-id="attendance">출석부 전체 보기</button></div>
    <div class="list">${recent.map(a => { const p = a.person; const d = p ? P.dept(p.dept) : null;
      return `<div class="row"><i class="chipdot" style="background:${d ? d.color : '#bbb'}"></i><div><div class="nm">${esc(p ? p.name : a.guest.name)}</div><div class="meta">${d ? d.name + ' · ' + esc(p.grade) : '명단 외'}</div></div><span class="meta">${a.kiosk}</span><span class="meta">${P.hhmm(a.last)}</span></div>`; }).join('')}</div>`;
}
function serverPeople(s) {
  const list = P.visiblePeople();
  const editing = s.editing && P.people.find(p => p.id === s.editing);
  return `<h1>명단<small>${P.people.length}명 · 이름을 누르면 고칠 수 있어요. 얼굴 등록은 키오스크에서 합니다.</small></h1>
    <input class="search" data-field="search" value="${esc(s.search)}" placeholder="이름, 부서, 학년으로 찾기" aria-label="명단 찾기">
    <div class="depts">${P.DEPTS.map(d => `<button class="chip" style="font-size:18px;padding:6px 14px" data-act="filter" data-id="${d.id}" aria-pressed="${s.deptFilter === d.id}"><i class="chipdot" style="background:${d.color};width:14px;height:14px"></i>${d.name}</button>`).join('')}</div>
    ${editing ? editForm(editing) : ''}
    <div class="list">${list.map(p => { const d = P.dept(p.dept);
      return `<div class="row click" data-act="edit" data-id="${p.id}"><i class="chipdot" style="background:${d.color}"></i><div><div class="nm">${esc(p.name)}${p.isNew ? ' <span class="meta">· 오늘 등록</span>' : ''}</div><div class="meta">${d.name} · ${esc(p.grade)}</div></div><span class="meta">얼굴 ${p.samples}장</span><span class="meta">›</span></div>`; }).join('') || '<div class="row"><span></span><span class="meta">찾는 사람이 없어요</span></div>'}</div>`;
}
function editForm(p) {
  return `<div class="editsheet" data-editform><b style="font-size:24px">${esc(p.name)} 정보 고치기</b>
    <div class="grid2"><input data-edit="name" value="${esc(p.name)}" aria-label="이름">
    <select data-edit="dept" aria-label="부서">${P.DEPTS.map(d => `<option value="${d.id}" ${d.id === p.dept ? 'selected' : ''}>${d.name}</option>`).join('')}</select>
    <input data-edit="grade" value="${esc(p.grade)}" aria-label="학년"></div>
    <div style="display:flex;gap:10px"><button class="sbtn primary" data-act="saveperson" data-id="${p.id}">저장</button><button class="sbtn ghost" data-act="cancel-edit">닫기</button><button class="sbtn danger" style="margin-left:auto" data-act="deleteperson" data-id="${p.id}">명단에서 지우기</button></div></div>`;
}
function serverAttendance(s) {
  const groups = P.attendanceByDept();
  const guests = P.guests();
  return `<h1>출석부<small>10월 31일 (오늘) · 부서별로 누가 왔는지 봅니다</small></h1>
    <div style="display:flex;gap:10px"><button class="sbtn ghost">◂ 지난주</button><button class="sbtn">오늘</button><button class="sbtn ghost" style="margin-left:auto">엑셀 파일로 저장</button></div>
    <div class="groups">${groups.map(g => {
      const ids = new Set(g.rows.map(r => r.person.id));
      const roster = P.people.filter(p => p.dept === g.dept.id);
      return `<div class="group"><h3><i class="chipdot" style="background:${g.dept.color}"></i>${g.dept.name}<span>${g.present} / ${g.roster}</span></h3>
        <div class="bar"><i style="width:${Math.round(g.present / g.roster * 100)}%"></i></div>
        <div class="names">${roster.map(p => `<span class="${ids.has(p.id) ? '' : 'no'}">${esc(p.name)}</span>`).join('')}</div></div>`; }).join('')}
      ${guests.length ? `<div class="group"><h3>명단 외<span>${guests.length}</span></h3><div class="names">${guests.map(g => `<span>${esc(g.guest.name)}</span>`).join('')}</div></div>` : ''}</div>`;
}
function serverKiosks(s) {
  return `<h1>키오스크<small>교회 태블릿만 허락하세요. 잃어버린 기기는 연결을 끊습니다.</small></h1>
    <div class="list">${P.kiosks.map(k => `<div class="row" style="grid-template-columns:22px 1fr auto"><i class="dot ${k.status === 'online' ? '' : 'off'}"></i>
      <div><div class="nm">${esc(k.name)}</div><div class="meta">${k.status === 'online' ? '연결됨 · 마지막 접속 ' + k.last : '연결을 기다리는 중'} · ${k.id}</div></div>
      ${k.status === 'pending' ? `<button class="sbtn primary" data-act="approve" data-id="${k.id}">허락하기</button>` : `<button class="sbtn ghost" data-act="remove" data-id="${k.id}">연결 끊기</button>`}</div>`).join('')}</div>
    <div class="card"><span class="k-label">새 키오스크 연결하는 법</span><span>키오스크 앱 설정에 이 주소를 입력하세요: <b>http://192.168.45.107:18080</b></span></div>`;
}

P.mount({ root: document.getElementById('app'), kiosk, server });
</script>
